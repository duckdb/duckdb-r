# Periodically collect results and failure logs for completed runs of the
# "rcc" workflow and store them on the orphan branch "rcc".
#
# The orphan branch holds only the collected data
# (runs.json, runs.ndjson, logs/<id>.log) and shares no history with the
# default branch.

on:
  schedule:
    # Every 30 minutes. The chunked promotion loop gates on this data: a chunk
    # only advances once every commit in it has a completed run recorded here,
    # so harvest latency is the loop's cycle time.
    - cron: "13,43 * * * *"
  push:
    paths:
      - ".github/workflows/rcc-logs.yaml"
      - "scripts/rcc-logs.sh"
  workflow_dispatch:

name: rcc-logs

# Keeps two ticks of *this* workflow from redoing the same API work; it is not
# shared with the fan-in job in each.yaml, which pushes to the same branch and
# resolves collisions by retrying (see scripts/rcc-push.sh) rather than by
# queueing, because a queued run in a busy group gets cancelled outright.
concurrency:
  group: rcc-logs
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'krlmlr/duckdb-r'
    runs-on: ubuntu-26.04

    name: "Collect rcc workflow logs"

    permissions:
      contents: write
      actions: read

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add rcc worktree at runs/
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin rcc >/dev/null 2>&1; then
            echo "Existing rcc branch found; checking it out as a worktree."
            git fetch origin rcc:rcc
            git worktree add runs rcc
          else
            echo "rcc branch does not exist yet; creating an orphan worktree."
            git worktree add --orphan -b rcc runs
          fi

      - name: Collect rcc workflow runs and failure logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/rcc-logs.sh

      # A rejected push re-derives against the new remote tip rather than
      # retrying the same commit; see scripts/rcc-push.sh. Re-running
      # scripts/rcc-logs.sh is cheap on a retry because it skips every commit
      # already recorded in runs2.ndjson.
      - name: Commit and push to rcc branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash scripts/rcc-push.sh \
            "rcc-logs: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -- bash scripts/rcc-logs.sh
