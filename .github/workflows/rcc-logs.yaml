# Collect results and failure logs for completed runs of the "rcc" workflow and
# store them on the orphan branch "rcc2". Run on request, not on a schedule.
#
# The orphan branch holds only the collected data -- one record per commit at
# runs2.d/<xx>/<sha>.ndjson and one log per failed commit at
# logs2.d/<xx>/<sha>.log -- and shares no history with the default branch.
#
# This is the backstop, not the main path: the `each-rcc` legs publish their own
# verdicts seconds after deciding them. What is left for this job is the leg that
# never published -- because the run was cancelled whole, or because the push
# itself failed.
#
# Dispatch-only, deliberately. It used to tick every 30 minutes, from when the
# promotion loop gated on this data and harvest latency was its cycle time. The
# loop reads the runs that decided a commit now
# (.claude/skills/series-loop.md stage 2), so the schedule was paying ~48 runs a
# day to keep a copy warm that a firing normally never opens -- and, worse,
# making the copy look authoritative by being continuously fresh.
#
# The leg's own publish stays, and is the store's one automatic writer. A run
# takes 2-13 minutes, so a firing that needs this dispatches it and reads the
# result on its next pass rather than waiting.

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/rcc-logs.yaml"
      - "scripts/rcc-logs.sh"

name: rcc-logs

# Keeps two runs of *this* workflow from redoing the same API work. It is not
# shared with the other writers to the branch, and does not need to be: every
# producer stages files at disjoint paths and publishes them with plumbing
# (scripts/rcc-publish.sh), so a collision costs a tree fetch and a re-commit.
# A shared group would be worse than no group at all -- only one run may be
# *pending* per group, so a third writer queued behind the second cancels it.
concurrency:
  group: rcc-logs
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'krlmlr/duckdb-r'
    runs-on: ubuntu-26.04

    name: "Collect rcc workflow logs"

    permissions:
      contents: write
      actions: read

    steps:
      # Full history: the script walks the first-parent commits of every *-dev
      # branch to find the ones the store has no record for.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # No worktree of the store: which commits are already decided is one
      # tree-only fetch, and the store's bulk is harvested logs this job has no
      # use for. What it collects goes into a staging directory shaped like the
      # branch.
      - name: Collect rcc workflow runs and failure logs
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: ${{ runner.temp }}/rcc-stage
        run: bash scripts/rcc-logs.sh

      - name: Publish to the rcc2 branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ## -- Publish to the rcc2 branch --
          bash scripts/rcc-publish.sh \
            "rcc-logs: refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            "${RUNNER_TEMP}/rcc-stage"
