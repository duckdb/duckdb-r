# Reproducer for https://github.com/duckdb/duckdb-r/issues/2882:
# on Windows, DuckDB mishandles network (UNC) paths such as `\\server\share\x`.
#
# Temporary: this file and `.github/issue-2882/` live in their own commits and are dropped before a fix merges.
# It runs on a push to its own branch only.
#
# Both jobs use the administrative share `\\localhost\C$` as a stand-in for a network drive,
# and try each spelling R hands out (`\\server\share\x`, `//server/share/x`, `\\server/share/x`)
# for a database file, recursive globs over CSV and Parquet, and a single Parquet file.
# Each check prints one `RESULT <spelling> <check> OK|FAIL <detail>` line;
# then `tests/testthat/test-unc-path.R` runs against the same installation.
# `baseline` runs against the CRAN binary (and 1.5.5 and 1.5.6 from P3M snapshots for contrast),
# `source` builds this checkout with `R CMD INSTALL` and the Rtools toolchain, as CRAN builds it, twice:
# build 1 from the unchanged tree (label `unpatched`), whose objects and ccache are saved right after it,
# then build 2 with `.github/issue-2882/unc-path.patch` applied in the build tree (label `patched`),
# rebuilding only the unity objects of the patched engine sources; no commit changes `src/duckdb/`.
# `baseline` passes either way, unless the install fails; its verdicts are in the log and the job summary.
# `source` ends with a verdict and fails unless the unpatched build fails a check or a test
# and the patched build fails none.
#
# Put `[skip-src]` or `[skip-base]` in the head commit's message to skip that job while iterating.

on:
  push:
    branches:
      - claude/issue-2882-windows-unc-path

name: repro-2882

permissions:
  contents: read

env:
  # The plain checks: Rscript repro.R <label> [<library>]
  REPRO_R: |
    args <- commandArgs(trailingOnly = TRUE)
    label <- args[[1]]
    lib <- if (length(args) >= 2 && nzchar(args[[2]])) args[[2]] else NULL
    if (!is.null(lib)) .libPaths(c(lib, .libPaths()))
    suppressPackageStartupMessages({
      library(DBI)
      library(duckdb)
    })
    summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
    to_summary <- function(...) {
      if (nzchar(summary_file)) cat(..., sep = "\n", file = summary_file, append = TRUE)
    }
    out <- function(...) {
      line <- paste(...)
      cat(line, "\n", sep = "")
      flush(stdout())
      to_summary(line)
    }

    version <- format(packageVersion("duckdb"))
    cat("duckdb", version, "from", find.package("duckdb"), "\n")
    cat(R.version.string, "\n")

    dir <- tempfile("unc")
    dir.create(dir)
    dir <- normalizePath(dir, winslash = "\\")
    unc <- paste0("\\\\localhost\\", substr(dir, 1, 1), "$", substring(dir, 3))
    reachable <- dir.exists(unc)
    cat("local dir:", dir, "\n")
    cat("unc:      ", unc, "\n")
    cat("dir.exists(unc):", reachable, "\n")
    to_summary(
      sprintf("### %s: duckdb %s, %s", label, version, R.version.string),
      sprintf("Administrative share reachable: %s", reachable),
      "",
      "```"
    )

    slashed <- chartr("\\", "/", substring(unc, 3))
    roots <- c(
      backslash = unc,
      slash = paste0("//", slashed),
      mixed = paste0("\\\\", slashed)
    )
    seps <- c(backslash = "\\", slash = "/", mixed = "/")

    # `expr` is a promise, so an error anywhere in it is caught here.
    check <- function(name, what, expr) {
      res <- tryCatch(
        expr,
        error = function(e) list(ok = FALSE, detail = paste("error:", conditionMessage(e)))
      )
      detail <- gsub("[\r\n]+", " ", paste(res$detail, collapse = " "))
      out("RESULT", name, what, if (isTRUE(res$ok)) "OK" else "FAIL", detail)
    }

    # One value from a fresh in-memory connection.
    query1 <- function(sql) {
      con <- dbConnect(duckdb())
      on.exit(dbDisconnect(con, shutdown = TRUE))
      dbGetQuery(con, sql)[[1]]
    }

    # One file at each of two depths, written through the local path.
    fwd <- chartr("\\", "/", dir)
    dir.create(file.path(dir, "a", "b"), recursive = TRUE)
    tryCatch(
      {
        con <- dbConnect(duckdb())
        for (fmt in c("csv", "parquet")) {
          dbExecute(con, sprintf("COPY (SELECT 1 AS x) TO '%s/a/one.%s' (FORMAT %s)", fwd, fmt, fmt))
          dbExecute(con, sprintf("COPY (SELECT 2 AS x) TO '%s/a/b/two.%s' (FORMAT %s)", fwd, fmt, fmt))
        }
        dbDisconnect(con, shutdown = TRUE)
      },
      error = function(e) cat("setup of the glob files failed:", conditionMessage(e), "\n")
    )
    cat("local files:", list.files(dir, recursive = TRUE), "\n")

    stray <- paste0(substr(dir, 1, 2), "\\localhost")

    for (name in names(roots)) {
      root <- roots[[name]]
      sep <- seps[[name]]
      cat("--", name, "root:", root, "\n")

      check(name, "normalize", {
        if (!exists("path_normalize", envir = asNamespace("duckdb"), inherits = FALSE)) {
          list(ok = FALSE, detail = "duckdb:::path_normalize() does not exist")
        } else {
          value <- duckdb:::path_normalize(paste0(root, sep, "db-", name, ".duckdb"))
          list(ok = grepl("^//localhost/", chartr("\\", "/", value), ignore.case = TRUE), detail = value)
        }
      })

      check(name, "dbdir", {
        path <- paste0(root, sep, "db-", name, ".duckdb")
        con <- dbConnect(duckdb(path))
        dbExecute(con, "CREATE TABLE t AS SELECT 1 AS x")
        dbDisconnect(con, shutdown = TRUE)
        target <- file.path(dir, paste0("db-", name, ".duckdb"))
        if (file.exists(target)) {
          list(ok = TRUE, detail = target)
        } else {
          list(
            ok = FALSE,
            detail = paste0(
              "missing; files in dir: ", paste(list.files(dir), collapse = ","),
              "; ", stray, " exists: ", dir.exists(stray)
            )
          )
        }
      })

      for (fmt in c("csv", "parquet")) {
        check(name, paste0("glob_", fmt), {
          s <- query1(sprintf(
            "SELECT sum(x) FROM read_%s('%s%sa%s**%s*.%s')",
            fmt, root, sep, sep, sep, fmt
          ))
          list(ok = isTRUE(all.equal(as.numeric(s), 3)), detail = paste("sum =", format(s)))
        })
      }

      check(name, "single_parquet", {
        s <- query1(sprintf("SELECT sum(x) FROM read_parquet('%s%sa%sone.parquet')", root, sep, sep))
        list(ok = isTRUE(all.equal(as.numeric(s), 1)), detail = paste("sum =", format(s)))
      })
    }
    to_summary("```", "")

  # The test file: Rscript repro-test.R <label> [<library>], from the checkout.
  REPRO_TEST_R: |
    args <- commandArgs(trailingOnly = TRUE)
    label <- args[[1]]
    lib <- if (length(args) >= 2 && nzchar(args[[2]])) args[[2]] else NULL
    if (!is.null(lib)) .libPaths(c(lib, .libPaths()))
    # skip_on_cran() skips in a non-interactive session unless this is set.
    Sys.setenv(NOT_CRAN = "true")
    library(testthat)
    cat("duckdb", format(packageVersion("duckdb")), "from", find.package("duckdb"), "\n")
    # Helpers and setup files under tests/testthat are sourced by test_file();
    # load_package = "installed" attaches the installed package and runs the tests in its namespace.
    res <- tryCatch(
      test_file(
        "tests/testthat/test-unc-path.R",
        package = "duckdb",
        load_package = "installed",
        reporter = "progress",
        stop_on_failure = FALSE
      ),
      error = function(e) {
        cat("test_file() failed:", conditionMessage(e), "\n")
        NULL
      }
    )
    if (is.null(res)) {
      lines <- "test_file() did not complete"
    } else {
      df <- as.data.frame(res)
      df <- df[intersect(c("test", "nb", "failed", "skipped", "error", "warning", "passed"), names(df))]
      lines <- capture.output(print(df, right = FALSE))
    }
    cat("=== TESTTHAT", label, "\n")
    writeLines(lines)
    # One machine-readable line for the verdict: failures count failed expectations and errored tests.
    counts <- if (is.null(res)) c(NA, NA) else c(sum(df$failed) + sum(df$error), sum(df$passed))
    cat(paste("TESTTHAT_COUNTS", label, "FAIL", counts[[1]], "PASS", counts[[2]]), "\n", sep = "")
    summary_file <- Sys.getenv("GITHUB_STEP_SUMMARY")
    if (nzchar(summary_file)) {
      cat(
        sprintf("### %s: test-unc-path.R", label), "", "```", lines, "```", "",
        sep = "\n", file = summary_file, append = TRUE
      )
    }

jobs:
  baseline:
    name: CRAN binaries
    if: ${{ !contains(github.event.head_commit.message, '[skip-base]') }}
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      # 1.5.5 was tagged on 2026-07-24 and 1.5.6 on 2026-09-28:
      # the snapshot of 2026-09-15 serves 1.5.5, the one of 2026-10-20 serves 1.5.6.
      - name: Install duckdb 2.0.0 from CRAN, and 1.5.5 and 1.5.6 from P3M snapshots
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("DBI", "duckdb", "testthat", "withr"), type = "binary")
          print(packageVersion("duckdb"))
          stopifnot(packageVersion("duckdb") == "2.0.0")
          snapshots <- c(lib155 = "2026-09-15", lib156 = "2026-10-20")
          for (l in names(snapshots)) {
            lib <- file.path(Sys.getenv("RUNNER_TEMP"), l)
            dir.create(lib)
            install.packages("duckdb", lib = lib, type = "binary", repos = paste0("https://packagemanager.posit.co/cran/", snapshots[[l]]))
            print(packageVersion("duckdb", lib.loc = lib))
          }
          print(sessionInfo())

      - name: Write the scripts
        shell: pwsh
        run: |
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'repro.R') -Value $env:REPRO_R
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'repro-test.R') -Value $env:REPRO_TEST_R

      - name: Run the checks against duckdb 2.0.0, 1.5.6 and 1.5.5
        shell: bash
        run: |
          t="$(cygpath -u "$RUNNER_TEMP")"
          Rscript "$t/repro.R" cran200 "" || echo "::warning::checks against 2.0.0 exited with $?"
          Rscript "$t/repro.R" cran156 "$RUNNER_TEMP\\lib156" || echo "::warning::checks against 1.5.6 exited with $?"
          Rscript "$t/repro.R" cran155 "$RUNNER_TEMP\\lib155" || echo "::warning::checks against 1.5.5 exited with $?"

      - name: Run test-unc-path.R against duckdb 2.0.0
        shell: bash
        run: |
          Rscript "$(cygpath -u "$RUNNER_TEMP")/repro-test.R" cran200 "" || echo "::warning::testthat exited with $?"

  source:
    name: Source build
    if: ${{ !contains(github.event.head_commit.message, '[skip-src]') }}
    runs-on: windows-latest
    timeout-minutes: 240

    env:
      MAKEFLAGS: -j4
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
      CCACHE_MAXSIZE: 3G
      PATCH: .github/issue-2882/unc-path.patch

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check the patch and list the objects it affects
        shell: bash
        run: |
          ## -- Check the patch and list the objects it affects --
          # The patch is read from the commit, not the working tree, so its line endings are LF.
          # Each patched engine source is compiled through its unity file (src/duckdb/ub_<dir with / as _>.cpp),
          # whose object is deleted before build 2.
          # Headers under src/duckdb/src/include map to no object.
          set -euo pipefail
          git cat-file blob "HEAD:$PATCH" > "$RUNNER_TEMP/engine.patch"
          : > "$RUNNER_TEMP/affected-objects.txt"
          for p in $(sed -n 's|^+++ b/||p' "$RUNNER_TEMP/engine.patch"); do
            if printf '%s\n' "$p" | grep -Eq '^src/duckdb/src/include/.*\.hpp$'; then
              echo "$p is a header, no object mapped: a declaration-only header change needs no other objects rebuilt (make does not track header dependencies here)"
              continue
            fi
            if ! printf '%s\n' "$p" | grep -Eq '^src/duckdb/src/.*\.cpp$'; then
              echo "::error::$PATCH changes $p; only src/duckdb/src/**/*.cpp and src/duckdb/src/include/**/*.hpp are supported"
              exit 1
            fi
            rel=${p#src/duckdb/}
            obj="duckdb/ub_$(dirname "$rel" | tr / _).o"
            if ! tr -d '\r' < src/include/sources.mk | tr ' ' '\n' | grep -qxF "$obj"; then
              echo "::error::$p maps to $obj, which src/include/sources.mk does not list"
              exit 1
            fi
            echo "src/$obj" >> "$RUNNER_TEMP/affected-objects.txt"
          done
          sort -u -o "$RUNNER_TEMP/affected-objects.txt" "$RUNNER_TEMP/affected-objects.txt"
          if [ ! -s "$RUNNER_TEMP/affected-objects.txt" ]; then
            echo "::error::$PATCH changes no .cpp file"
            exit 1
          fi
          git apply --check --cached --verbose "$RUNNER_TEMP/engine.patch"
          cat "$RUNNER_TEMP/affected-objects.txt"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - name: Install the dependencies
        shell: Rscript {0}
        run: |
          options(repos = c(CRAN = "https://cloud.r-project.org"))
          install.packages(c("DBI", "testthat", "withr"), type = "binary")

      - name: Install ccache and wrap the compilers with it
        shell: bash
        run: |
          ## -- Install ccache and wrap the compilers with it --
          t="$(cygpath -u "$RUNNER_TEMP")/ccache-bin"
          mkdir -p "$t"
          curl -sSfL -o "$t/ccache.zip" https://github.com/ccache/ccache/releases/download/v4.11.3/ccache-4.11.3-windows-x86_64.zip
          unzip -q -j -o "$t/ccache.zip" '*/ccache.exe' -d "$t"
          cygpath -w "$t" | tee -a "$GITHUB_PATH"
          export PATH="$t:$PATH"
          ccache --version | head -n 1
          mkdir -p ~/.R
          {
            echo "CC=ccache $(R CMD config CC)"
            echo "CXX=ccache $(R CMD config CXX)"
            echo "CXX17=ccache $(R CMD config CXX17)"
          } | tee ~/.R/Makevars.win
          cxx="$(R CMD config CXX17)"
          echo "R=$(Rscript -e 'cat(format(getRversion()))')" | tee -a "$GITHUB_ENV"
          echo "GCC=$($cxx --version | head -n 1 | sed -r 's/[^A-Za-z0-9.]+/-/g')" | tee -a "$GITHUB_ENV"
          echo "CCACHE_DIR=$(cygpath -w "$RUNNER_TEMP")\\ccache" | tee -a "$GITHUB_ENV"
          # The tracked content of src/, computed before the build writes anything there.
          echo "SRC_KEY=$(git ls-files -s src | sha256sum | cut -c1-16)" | tee -a "$GITHUB_ENV"

      # Both caches are keyed on the content of src/, so a run whose sources did not change
      # restores an exact hit and saves nothing, and a changed tree restores the newest entry by prefix.
      - name: Restore ccache
        id: ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: repro-2882-ccache-${{ runner.os }}-R${{ env.R }}-${{ env.GCC }}-${{ env.SRC_KEY }}
          restore-keys: repro-2882-ccache-${{ runner.os }}-R${{ env.R }}-${{ env.GCC }}-

      - name: Restore object files
        id: objects
        uses: actions/cache/restore@v4
        with:
          path: |
            src/**/*.o
            src/.repro-manifest.txt
          key: repro-2882-objects-${{ runner.os }}-R${{ env.R }}-${{ env.GCC }}-${{ env.SRC_KEY }}
          restore-keys: repro-2882-objects-${{ runner.os }}-R${{ env.R }}-${{ env.GCC }}-

      - name: Make restored objects current for unchanged sources only
        shell: bash
        run: |
          ## -- Make restored objects current for unchanged sources only --
          # The checkout gives every source a fresh mtime, newer than any restored object.
          # Age all tracked sources under src/ to 2000-01-01, so the restored objects count as current,
          # then give a fresh mtime to each file whose blob differs from the manifest the objects were built from.
          # make cannot see every dependency (the engine's unity files include sources it does not list),
          # so a change it would miss deletes the objects it may affect, and ccache rebuilds them.
          set -euo pipefail
          git ls-files -s src | sort -k4 > "$RUNNER_TEMP/manifest.now"
          n_obj=$(find src -name '*.o' | wc -l)
          echo "restored objects: $n_obj"
          if [ ! -f src/.repro-manifest.txt ]; then
            echo "no manifest: cold build"
            find src -name '*.o' -delete
            exit 0
          fi
          git ls-files -z src | xargs -0 touch -d '2000-01-01 00:00:00'
          changed=$(diff <(awk '{print $2, $4}' src/.repro-manifest.txt) <(awk '{print $2, $4}' "$RUNNER_TEMP/manifest.now") | sed -n 's/^> [0-9a-f]* //p' || true)
          echo "changed since the objects were built:"
          echo "${changed:-(none)}"
          all_engine=0
          all_glue=0
          for f in $changed; do
            [ -f "$f" ] && touch "$f"
            case "$f" in
              src/Makevars*|src/include/*.mk) all_engine=1; all_glue=1 ;;
              src/duckdb/*.cpp|src/duckdb/*.c|src/duckdb/*.cc)
                rel="${f#src/duckdb/}"
                for ub in $(grep -l -F "$rel" src/duckdb/ub_*.cpp || true); do rm -fv "${ub%.cpp}.o"; done
                ;;
              src/duckdb/*) all_engine=1 ;;
              src/*.cpp|src/*.dd) ;;
              *) all_glue=1 ;;
            esac
          done
          if [ "$all_engine" = 1 ]; then echo "deleting all engine objects"; find src/duckdb -name '*.o' -delete; fi
          if [ "$all_glue" = 1 ]; then echo "deleting all glue objects"; rm -fv src/*.o; fi


      - name: "Build 1: install the unchanged tree"
        shell: bash
        run: |
          ## -- Build 1: install the unchanged tree --
          ccache --zero-stats
          mkdir -p "$RUNNER_TEMP/lib"
          start=$(date +%s)
          R CMD INSTALL --library="$RUNNER_TEMP/lib" --no-byte-compile . 2>&1 | tee "$RUNNER_TEMP/install.log" | grep -v -E '^(ccache )?(g\+\+|gcc) ' || true
          echo "R CMD INSTALL took $(( $(date +%s) - start )) s"
          grep -c -E '^ccache (g\+\+|gcc) ' "$RUNNER_TEMP/install.log" | sed 's/^/compiler invocations: /' || true
          ccache -s
          test -f "$RUNNER_TEMP/lib/duckdb/libs/x64/duckdb.dll"
          git ls-files -s src | sort -k4 > src/.repro-manifest.txt
          echo "object files: $(find src -name '*.o' | wc -l), $(du -sh src --exclude='*.cpp' | cut -f1) under src/ without sources"
          du -sh "$CCACHE_DIR"

      # Saved before the patch is applied, so both caches hold the unchanged tree that SRC_KEY names.
      - name: Save ccache
        if: always() && steps.ccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: repro-2882-ccache-${{ runner.os }}-R${{ env.R }}-${{ env.GCC }}-${{ env.SRC_KEY }}

      - name: Save object files
        if: always() && steps.objects.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            src/**/*.o
            src/.repro-manifest.txt
          key: repro-2882-objects-${{ runner.os }}-R${{ env.R }}-${{ env.GCC }}-${{ env.SRC_KEY }}

      - name: Write the scripts
        shell: pwsh
        run: |
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'repro.R') -Value $env:REPRO_R
          Set-Content -Path (Join-Path $env:RUNNER_TEMP 'repro-test.R') -Value $env:REPRO_TEST_R

      - name: Run the checks and test-unc-path.R against the unpatched build
        shell: bash
        run: |
          ## -- Run the checks and test-unc-path.R against the unpatched build --
          t="$(cygpath -u "$RUNNER_TEMP")"
          Rscript "$t/repro.R" unpatched "$RUNNER_TEMP\\lib" 2>&1 | tee "$t/checks-unpatched.log" || echo "::warning::checks exited with $?"
          Rscript "$t/repro-test.R" unpatched "$RUNNER_TEMP\\lib" 2>&1 | tee "$t/testthat-unpatched.log" || echo "::warning::testthat exited with $?"

      - name: Apply the engine patch
        shell: bash
        run: |
          ## -- Apply the engine patch --
          # Applied to the index from the LF blob, then written out by git,
          # so the patched file gets the same line endings as the rest of the checkout.
          set -euo pipefail
          git apply --cached --verbose "$RUNNER_TEMP/engine.patch"
          git diff --cached --name-only | tee "$RUNNER_TEMP/patched-files.txt"
          xargs git checkout-index -f -- < "$RUNNER_TEMP/patched-files.txt"
          git diff --cached --stat
          # make cannot see that a unity object includes the patched source, so delete those objects.
          xargs rm -fv < "$RUNNER_TEMP/affected-objects.txt"

      - name: "Build 2: install the patched tree"
        shell: bash
        run: |
          ## -- Build 2: install the patched tree --
          ccache --zero-stats
          mkdir -p "$RUNNER_TEMP/lib-patched"
          start=$(date +%s)
          R CMD INSTALL --library="$RUNNER_TEMP/lib-patched" --no-byte-compile . 2>&1 | tee "$RUNNER_TEMP/install-patched.log" | grep -v -E '^(ccache )?(g\+\+|gcc) ' || true
          echo "R CMD INSTALL took $(( $(date +%s) - start )) s"
          grep -c -E '^ccache (g\+\+|gcc) ' "$RUNNER_TEMP/install-patched.log" | sed 's/^/compiler invocations: /' || true
          ccache -s
          test -f "$RUNNER_TEMP/lib-patched/duckdb/libs/x64/duckdb.dll"

      - name: Run the checks and test-unc-path.R against the patched build
        shell: bash
        run: |
          ## -- Run the checks and test-unc-path.R against the patched build --
          t="$(cygpath -u "$RUNNER_TEMP")"
          Rscript "$t/repro.R" patched "$RUNNER_TEMP\\lib-patched" 2>&1 | tee "$t/checks-patched.log" || echo "::warning::checks exited with $?"
          Rscript "$t/repro-test.R" patched "$RUNNER_TEMP\\lib-patched" 2>&1 | tee "$t/testthat-patched.log" || echo "::warning::testthat exited with $?"

      # Red then green: the unpatched build must fail exactly the expected checks and at least one test, the patched build none.
      - name: Verdict
        if: always()
        shell: bash
        run: |
          ## -- Verdict --
          t="$(cygpath -u "$RUNNER_TEMP")"
          for l in unpatched patched; do
            touch "$t/checks-$l.log" "$t/testthat-$l.log"
            grep '^RESULT ' "$t/checks-$l.log" | awk '{print $2 "/" $3, $4}' > "$t/results-$l.txt" || true
          done
          report=$(
            echo "check                     unpatched  patched"
            LC_ALL=C join -a1 -a2 -e '-' -o 0,1.2,2.2 <(LC_ALL=C sort "$t/results-unpatched.txt") <(LC_ALL=C sort "$t/results-patched.txt") \
              | awk '{printf "%-25s %-10s %s\n", $1, $2, $3}'
            echo
            grep -h '^TESTTHAT_COUNTS ' "$t/testthat-unpatched.log" "$t/testthat-patched.log" || echo "no testthat counts"
          )
          echo "$report"
          count() { grep -c "$2" "$t/results-$1.txt" || true; }
          tt() { sed -n "s/^TESTTHAT_COUNTS $1 FAIL \([0-9]*\) PASS \([0-9]*\)[[:space:]]*\$/\\$2/p" "$t/testthat-$1.log" | head -n 1; }
          u_fail=$(count unpatched ' FAIL$'); p_fail=$(count patched ' FAIL$'); p_all=$(count patched .)
          u_tfail=$(tt unpatched 1); p_tfail=$(tt patched 1); p_tpass=$(tt patched 2)
          verdict=pass
          reasons=()
          if [ "$p_all" -eq 0 ]; then verdict=fail; reasons+=("patched: no RESULT lines"); fi
          if [ "$p_fail" -ne 0 ]; then verdict=fail; reasons+=("patched: $p_fail RESULT FAIL"); fi
          if [ -z "$p_tfail" ] || [ "$p_tfail" -ne 0 ] || [ "${p_tpass:-0}" -eq 0 ]; then
            verdict=fail; reasons+=("patched: testthat FAIL ${p_tfail:-?} PASS ${p_tpass:-?}")
          fi
          # The unchanged tree must fail exactly the checks #2882 reports on 2.0, and test-unc-path.R at least once.
          expected="mixed/dbdir mixed/glob_csv mixed/glob_parquet mixed/normalize slash/glob_csv slash/glob_parquet"
          u_failed=$(awk '$2 == "FAIL" {print $1}' "$t/results-unpatched.txt" | LC_ALL=C sort | tr '\n' ' ' | sed 's/ $//')
          if [ "$u_failed" != "$expected" ]; then
            verdict=fail; reasons+=("unpatched: failed [$u_failed], expected [$expected]")
          fi
          if [ -z "$u_tfail" ] || [ "$u_tfail" -lt 1 ]; then
            verdict=fail; reasons+=("unpatched: testthat FAIL ${u_tfail:-?}, expected at least 1")
          fi
          {
            echo "### Verdict: $verdict"
            echo
            echo '```'
            echo "$report"
            echo '```'
            for r in "${reasons[@]}"; do echo "- $r"; done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "VERDICT $verdict"
          for r in "${reasons[@]}"; do echo "::error::$r"; done
          [ "$verdict" = pass ]
