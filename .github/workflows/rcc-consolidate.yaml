# Consolidate the orphan `rcc2` branch: drop everything past the retention
# window, and squash the history to two commits.
#
# `workflow_dispatch` only, and deliberately so. Every other writer to that
# branch is additive and races safely (see scripts/rcc-publish.sh); this one
# rewrites the branch, and the one thing that makes a rewrite safe is knowing
# nothing else is mid-flight. A schedule cannot know that. The push carries a
# lease as a backstop, so a writer that did land in between refuses the push
# rather than losing its record.
#
# Defaults to a dry run: it reports what it would drop and changes nothing. Set
# `apply` to actually rewrite the branch.

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Rewrite and force-push. Leave off for a dry run."
        type: boolean
        default: false
      retention-days:
        description: "Keep records and logs at most this old (0 = keep all)"
        type: string
        default: "180"

name: rcc-consolidate

# Not shared with any other workflow: the writers this would serialise against
# do not need serialising, and queueing behind a long `each-rcc` run would only
# make the lease staler. Two consolidations at once, though, are pointless.
concurrency:
  group: rcc-consolidate
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.repository == 'krlmlr/duckdb-r'
    runs-on: ubuntu-26.04

    name: "Consolidate the rcc2 branch"

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: ./.github/workflows/git-identity

      # The one job that does want a full checkout of the store: it decides what
      # to drop by reading every record, and rewrites the branch as a whole.
      - name: Add rcc2 worktree at runs/
        run: |
          ## -- Add rcc2 worktree at runs/ --
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin rcc2 > /dev/null 2>&1; then
            echo "No rcc2 branch to consolidate."
            exit 1
          fi
          # `+` because a previous consolidation force-pushed this branch, and a
          # non-fast-forward fetch is the normal case here rather than an error.
          git fetch origin '+refs/heads/rcc2:refs/heads/rcc2'
          git worktree add runs rcc2
        shell: bash

      - name: Consolidate
        env:
          GH_TOKEN: ${{ github.token }}
          OUT_DIR: runs
          APPLY: ${{ inputs.apply && '1' || '' }}
          RCC_RETENTION_DAYS: ${{ inputs.retention-days }}
        run: scripts/rcc-consolidate.sh | tee "${RUNNER_TEMP}/consolidate.log"
        shell: bash

      - name: Summarise
        if: always()
        run: |
          ## -- Summarise --
          {
            echo "## rcc-consolidate"
            echo
            if [ "${APPLY}" = "1" ]; then
              echo "Applied: the branch was rewritten and force-pushed."
            else
              echo "Dry run. Re-dispatch with \`apply\` to rewrite the branch."
            fi
            echo
            echo '```'
            cat "${RUNNER_TEMP}/consolidate.log" 2>/dev/null || echo "(no output)"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
        env:
          APPLY: ${{ inputs.apply && '1' || '' }}
        shell: bash
