# Scratch workflow for the path-canonicalization experiment.
#
# This branch drops every other workflow on purpose: the only thing wanted from
# CI here is one measurement per platform, uncontested and fast. Nothing here is
# meant to be merged -- the findings land in
# experiments/2026-08-09-path-canonicalization/README.md and the branch is
# thrown away.
#
# DBI and duckdb come from CRAN. The package in this repository is neither built
# nor installed; the questions are about path semantics, which the released
# binary answers as well as a source build would.

name: Probe path facts

on:
  push:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install DBI and duckdb from CRAN
        run: install.packages(c("DBI", "duckdb"))
        shell: Rscript {0}

      - name: Probe
        run: |
          Rscript experiments/2026-08-09-path-canonicalization/probe.R 2>&1 | tee probe-${{ matrix.os }}.txt
        shell: bash

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.os }}
          path: probe-${{ matrix.os }}.txt
