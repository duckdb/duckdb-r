# Fail a pull request to `main` that belongs on the oldest active release
# branch. It runs in the canonical repository only, so the fork's pull requests
# into its own `main` are left alone. What passes, and what the failure says, is
# in scripts/pull-request-base.sh's header; this file only reads the pull request
# and its files from GitHub's API and hands them over. Where the guard sits
# among the workflows, and what makes it block a merge:
# handbook/operations/ci/workflows/README.md.

name: pull-request-base

on:
  pull_request:
    branches: [main]
    # `edited` covers a base changed to `main`, and the label events the label
    # that lets a pull request stay there.
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

# A burst of events on one pull request leaves the newest run.
concurrency:
  group: pull-request-base-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  base:
    if: github.repository == 'duckdb/duckdb-r'

    runs-on: ubuntu-26.04

    name: "pull-request-base"

    timeout-minutes: 5

    steps:
      # The scripts alone, which hold the decision and the declaration it reads.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          sparse-checkout: scripts

      # Read from the API rather than the event, so a re-run sees the labels and
      # the base as they are now.
      - name: Check that the pull request belongs on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pull.json"
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" > "$RUNNER_TEMP/files.json"
          scripts/pull-request-base.sh "$RUNNER_TEMP/pull.json" "$RUNNER_TEMP/files.json"
        shell: bash
