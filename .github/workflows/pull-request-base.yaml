# Fail a pull request to `main` that belongs on the oldest active release
# branch. It runs in the canonical repository only, so the fork's pull requests
# into its own `main` are left alone. What passes, and what the failure says, is
# in scripts/pull-request-base.sh's header; this file only reads the pull request
# and its files from GitHub's API and hands them over. Where the guard sits
# among the workflows, what lets a pull request stay on `main`, and what makes
# the guard block a merge: handbook/operations/ci/workflows/README.md.
#
# `pull_request_target`, not `pull_request`, so that a pull request cannot decide
# its own check: GitHub runs this file from the default branch, `main`, and the
# checkout below takes `main`'s scripts and declaration, never the pull
# request's head or merge commit. The pull request reaches the job only as the
# JSON the API returns, which the script reads as data and never runs, so the
# token stays read-only and no secret is used.
#
# No branch filter, which would not match the `edited` event of a pull request
# retargeted away from `main` and so leave its earlier failure standing. The job
# runs instead for a pull request to `main` and for any change of base, and the
# script passes every base but `main`; a pull request to another branch skips
# the job without starting a runner.

name: pull-request-base

on:
  pull_request_target:
    # `edited` covers a changed base, and the label events the label that lets
    # a pull request stay on `main`.
    types: [opened, reopened, edited, synchronize, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  base:
    if: >-
      github.repository == 'duckdb/duckdb-r' &&
      (github.event.pull_request.base.ref == 'main' || github.event.changes.base)

    # A burst of events on one pull request leaves the newest run. Set on the
    # job, not the workflow, so a run whose job is skipped cannot cancel one
    # that checks.
    concurrency:
      group: pull-request-base-${{ github.event.pull_request.number }}
      cancel-in-progress: true

    runs-on: ubuntu-26.04

    name: "pull-request-base"

    timeout-minutes: 5

    steps:
      # `main`'s scripts alone, which hold the decision and the declaration it
      # reads; never the pull request's own.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          sparse-checkout: scripts
          persist-credentials: false

      # Read from the API rather than the event, so a re-run sees the labels and
      # the base as they are now.
      - name: Check that the pull request belongs on main
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          gh api "repos/$REPO/pulls/$PR" > "$RUNNER_TEMP/pull.json"
          gh api --paginate "repos/$REPO/pulls/$PR/files?per_page=100" > "$RUNNER_TEMP/files.json"
          scripts/pull-request-base.sh "$RUNNER_TEMP/pull.json" "$RUNNER_TEMP/files.json"
        shell: bash
