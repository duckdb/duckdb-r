# Copy the per-commit verdicts of the fork onto the same commits here, as
# commit statuses with context `each-rcc (fork)`, for every open pull request
# whose head is in the fork, so its commit list shows each commit's verdict and
# links to the leg that decided it. It runs in the canonical repository only.
# The mechanism, the watermark and the limits on a run among it, is in
# scripts/each-mirror.sh's header; why it runs here and is bounded that way is
# in handbook/operations/ci/per-commit/upstream/README.md.

name: each-rcc-mirror

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      max-writes:
        description: "Statuses this run posts at most, a whole number"
        type: string
        default: ""
      dry-run:
        description: "Print the posts instead of sending them"
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read
  statuses: write

# One run at a time, and a queued one waits rather than cancelling a run in the
# middle of its paced writes.
concurrency:
  group: each-rcc-mirror
  cancel-in-progress: false

jobs:
  mirror:
    if: github.repository == 'duckdb/duckdb-r'

    runs-on: ubuntu-26.04

    name: "Copy the fork's verdicts onto open pull requests"

    # MAX_WRITES posts PAUSE seconds apart take 37.5 minutes, and BUDGET stops
    # the posts 45 minutes into the script, so the cache save after it always
    # runs.
    timeout-minutes: 55

    steps:
      # Commits only, and the scripts: a pull request's commits are read with
      # `git rev-list`, which needs no trees.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: scripts

      # The watermark: every record already confirmed on its commit, restored
      # from the newest run or attempt that saved one.
      - uses: actions/cache/restore@v5
        with:
          path: ${{ runner.temp }}/each-mirror
          key: each-mirror-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: each-mirror-

      - name: Copy the verdicts
        env:
          GH_TOKEN: ${{ github.token }}
          FORK: krlmlr/duckdb-r
          CONTEXT: each-rcc (fork)
          STATE: ${{ runner.temp }}/each-mirror/state
          MAX_WRITES: ${{ inputs.max-writes || '300' }}
          PAUSE: "7.5"
          BUDGET: "2700"
          RESERVE: "300"
          DRY_RUN: ${{ inputs.dry-run && '1' || '' }}
        run: scripts/each-mirror.sh
        shell: bash

      # A key per attempt, because a cache key that exists is never written
      # again, and a re-run's watermark has to be saved too.
      - uses: actions/cache/save@v5
        if: always()
        with:
          path: ${{ runner.temp }}/each-mirror
          key: each-mirror-${{ github.run_id }}-${{ github.run_attempt }}
