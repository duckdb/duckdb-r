# Reproducer for https://github.com/duckdb/duckdb-r/issues/2974:
# CRAN's r-release-macos-x86_64 and r-oldrel-macos-arm64 compile against the
# MacOSX11.3 SDK, whose libc++ lacks reference_wrapper's converting
# constructor (LWG 2993). One job per architecture.
#
# Each job runs three builds of the same tree:
#   1. the unchanged tree with `make -k`, expected to fail, every error kept;
#   2. the same tree with .github/issue-2974/lwg2993.patch applied, must pass;
#   3. a smoke test of the installed package.
#
# The patch may touch only src/duckdb/src/**/*.cpp, and every file it changes
# must be one that fails to compile: the verdict requires build 1 to fail on
# exactly the unity objects of the patched files, with errors in exactly them.
#
# Each job keeps one cache entry under a fixed key, replaced on every save:
# the SDK, ccache (capped by CCACHE_MAXSIZE) and, when the verdict holds, the
# object files with a record of the commit, toolchain and compile flags they
# were built with. A fresh checkout gives every file a new mtime, so all
# tracked files are set to a fixed old date and only those that differ from
# the recorded commit are touched again.
#
# Throwaway: drop this file and .github/issue-2974/ before any fix merges.
# R CMD INSTALL prints "using SDK: NA" because `xcrun --show-sdk-version`
# fails with SDKROOT set to a path; the compile lines carry -isysroot.
on:
  push:
    branches:
      - claude/issue-2974-macos-sdk11
    paths:
      - ".github/workflows/issue-2974-macos-sdk11.yaml"
      - ".github/issue-2974/**"
      - "src/**"

name: issue-2974 macOS SDK 11

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    # -eo pipefail, so a pipe into tee reports the build's own status.
    shell: bash

jobs:
  sdk11:
    name: sdk11 (${{ matrix.arch }}, R ${{ matrix.r }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          # CRAN r-release-macos-x86_64: Apple clang 14.0.3, MacOSX11.3.1.sdk.
          - arch: x86_64
            runner: macos-15-intel
            r: release
            cran: r-release-macos-x86_64
          # CRAN r-oldrel-macos-arm64 (R 4.5): Apple clang 14.0.3, MacOSX11.3.1.sdk.
          - arch: arm64
            runner: macos-15
            r: oldrel
            cran: r-oldrel-macos-arm64
    permissions:
      contents: read
      # Replace this job's cache entry and delete superseded ones.
      actions: write
    env:
      CACHE_KEY: issue-2974-${{ matrix.arch }}
      SDK_VERSION: "11.3"
      SDK_URL: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX11.3.sdk.tar.xz
      PATCH: .github/issue-2974/lwg2993.patch
      CCACHE_DIR: /Users/runner/ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Per job; the whole entry (SDK, ccache, objects) stays under 1 GB.
      # ccache splits the cap over 16 directories, and a unity object larger
      # than its share is evicted at once: 300M lost the patched arm64 ones.
      CCACHE_MAXSIZE: 400M
      CCACHE_SLOPPINESS: include_file_mtime,include_file_ctime,time_macros
      BUILD_CACHE_META: /Users/runner/build-cache-meta
      UserNM: "true"
      NOT_CRAN: "true"
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Restore the SDK, ccache and the build tree
        id: restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/sdk
            ${{ env.CCACHE_DIR }}
            ${{ env.BUILD_CACHE_META }}
            src/*.o
            src/duckdb/**/*.o
          key: ${{ env.CACHE_KEY }}

      - name: Select the oldest Xcode on the image
        id: xcode
        run: |
          echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"
          ls -ld /Applications/Xcode*.app
          dev=$(python3 - <<'EOF'
          import glob, os, plistlib
          apps = [a for a in glob.glob("/Applications/Xcode_*.app") if not os.path.islink(a)]
          def ver(a):
              with open(os.path.join(a, "Contents/Info.plist"), "rb") as f:
                  v = plistlib.load(f)["CFBundleShortVersionString"]
              return tuple(int(x) for x in v.split("."))
          print(min(apps, key=ver) + "/Contents/Developer")
          EOF
          )
          echo "DEVELOPER_DIR=$dev" >> "$GITHUB_ENV"
          export DEVELOPER_DIR="$dev"
          xcodebuild -version
          ver=$(xcodebuild -version | sed -n 's/^Xcode //p')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "clang=$(xcrun clang++ --version | sed -n '1,1p')" >> "$GITHUB_OUTPUT"
          echo "CLANG=$(xcrun -f clang)" >> "$GITHUB_ENV"
          echo "CLANGXX=$(xcrun -f clang++)" >> "$GITHUB_ENV"

      - name: Download the SDK unless restored
        id: sdk
        run: |
          if [ -f ~/sdk/MacOSX${SDK_VERSION}.sdk/usr/include/c++/v1/functional ] \
              && [ "$(cat ~/sdk/url 2>/dev/null || true)" = "$SDK_URL" ]; then
            echo "SDK restored from the cache."
            exit 0
          fi
          echo "downloaded=true" >> "$GITHUB_OUTPUT"
          rm -rf ~/sdk
          mkdir -p ~/sdk
          curl -fsSL --retry 4 -o "$RUNNER_TEMP/sdk.tar.xz" "$SDK_URL"
          tar -xJf "$RUNNER_TEMP/sdk.tar.xz" -C ~/sdk
          echo "$SDK_URL" > ~/sdk/url
          ls ~/sdk

      - name: Point the compilers at the SDK
        run: |
          echo "SDKROOT=$HOME/sdk/MacOSX${SDK_VERSION}.sdk" >> "$GITHUB_ENV"
          test -f "$HOME/sdk/MacOSX${SDK_VERSION}.sdk/usr/include/c++/v1/functional"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - name: Install ccache and R dependencies
        run: |
          brew install ccache zstd
          Rscript -e 'install.packages("DBI")'

      - name: Wire ccache and the SDK into ~/.R/Makevars
        run: |
          mkdir -p ~/.R
          : > ~/.R/Makevars
          for v in CC CXX CXX17 CXX20; do
            cfg=$(R CMD config "$v" 2>/dev/null) || continue
            echo "R CMD config $v: $cfg"
            # Replace the leading compiler name by ccache, the selected
            # Xcode's compiler and the old SDK.
            [ -n "$cfg" ] || continue
            new=$(printf '%s\n' "$cfg" | sed -E \
              -e "s#^clang\+\+( |\$)#ccache $CLANGXX -isysroot $SDKROOT\1#" \
              -e "s#^clang( |\$)#ccache $CLANG -isysroot $SDKROOT\1#")
            echo "$v = $new" >> ~/.R/Makevars
          done
          for v in CXX17STD CXXFLAGS CXX17FLAGS LDFLAGS; do
            echo "R CMD config $v: $(R CMD config "$v" 2>&1)"
          done
          cat ~/.R/Makevars

      - name: Show the toolchain and where libc++ comes from
        id: toolchain
        run: |
          R --version | sed -n '1,1p'
          echo "Xcode: ${{ steps.xcode.outputs.version }}"
          echo "clang: ${{ steps.xcode.outputs.clang }}"
          echo "CRAN (${{ matrix.cran }}): Apple clang version 14.0.3 (clang-1403.0.22.14.1), SDK MacOSX11.3.1.sdk"
          cxx=$(R CMD config CXX17)
          echo "--- $CLANGXX -isysroot \$SDKROOT -xc++ -std=gnu++17 -E -v -"
          "$CLANGXX" -arch ${{ matrix.arch }} -isysroot "$SDKROOT" -xc++ -std=gnu++17 -E -v - </dev/null 2>&1 \
            | tee "$RUNNER_TEMP/clang-v.txt"
          paths=$(sed -n '/search starts here:/,/End of search list/p' "$RUNNER_TEMP/clang-v.txt")
          first_libcxx=$(printf '%s\n' "$paths" | { grep 'c++/v1' || true; } | sed -n '1,1p' | sed 's/^ *//')
          echo "first libc++ include dir: $first_libcxx"
          case "$first_libcxx" in
            "$SDKROOT"/usr/include/c++/v1) echo "OK: libc++ headers come from the SDK" ;;
            *) echo "::error::libc++ headers do not come from $SDKROOT"; exit 1 ;;
          esac
          echo "--- header actually used for <functional>"
          printf '#include <functional>\n' \
            | "$CLANGXX" -arch ${{ matrix.arch }} -isysroot "$SDKROOT" -xc++ -std=gnu++17 -fsyntax-only -H - 2>&1 | sed -n '1,3p'
          libcxx=$(printf '#include <ciso646>\nLIBCPP=_LIBCPP_VERSION\n' \
            | "$CLANGXX" -arch ${{ matrix.arch }} -isysroot "$SDKROOT" -xc++ -std=gnu++17 -E - | sed -n 's/^LIBCPP=//p')
          echo "_LIBCPP_VERSION: $libcxx"
          echo "libcxx=$libcxx" >> "$GITHUB_OUTPUT"
          echo "first_libcxx=$first_libcxx" >> "$GITHUB_OUTPUT"
          echo "rversion=$(R --version | sed -n '1s/^R version \([^ ]*\).*/\1/p')" >> "$GITHUB_OUTPUT"
          echo "end_ts=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Make make trust the restored objects
        id: mtimes
        run: |
          echo "start_ts=$(date +%s)" >> "$GITHUB_OUTPUT"
          SECONDS=0
          # Every tracked file gets the same old mtime, older than any object.
          git ls-files -z | xargs -0 touch -h -t 200001010000
          # Objects from another R, Xcode or SDK version are discarded.
          toolchain="${{ matrix.arch }} R ${{ steps.toolchain.outputs.rversion }} Xcode ${{ steps.xcode.outputs.version }} SDK $SDK_VERSION $(printf '%s' "$SDK_URL" | shasum -a 256 | cut -c1-12)"
          old_toolchain=$(cat "$BUILD_CACHE_META/toolchain" 2>/dev/null || true)
          echo "toolchain: ${old_toolchain:-<none>} -> $toolchain"
          echo "toolchain=$toolchain" >> "$GITHUB_OUTPUT"
          if [ "$old_toolchain" != "$toolchain" ]; then
            echo "Toolchain changed or unrecorded: discarding restored objects."
            find src -name '*.o' -delete
            rm -rf "$BUILD_CACHE_META"
          fi
          old_sha=$(cat "$BUILD_CACHE_META/sha" 2>/dev/null || true)
          echo "cache built from: ${old_sha:-<none>}, now: $GITHUB_SHA"
          echo "cache_sha=${old_sha:-none}" >> "$GITHUB_OUTPUT"
          # Compile flags: the Makevars this workflow writes and the tracked
          # Makevars and make fragments. Their hash is stored with the SHA.
          flags_hash=$(cat ~/.R/Makevars $(git ls-files 'src/Makevars*' 'src/include/*.mk') \
            | shasum -a 256 | cut -d ' ' -f 1)
          old_flags_hash=$(cat "$BUILD_CACHE_META/flags" 2>/dev/null || true)
          echo "flags hash: ${old_flags_hash:-<none>} -> $flags_hash"
          echo "flags_hash=$flags_hash" >> "$GITHUB_OUTPUT"
          touch_all_sources() {
            find src/duckdb \( -name '*.cpp' -o -name '*.cc' -o -name '*.c' \) -exec touch {} +
            touch src/*.cpp
          }
          if [ -z "$old_sha" ]; then
            echo "Cold: no restored build tree."
          elif [ "$old_sha" = "$GITHUB_SHA" ]; then
            echo "Same commit: nothing to touch."
          elif git fetch --depth=1 origin "$old_sha" \
              && git diff --name-only "$old_sha" "$GITHUB_SHA" > "$RUNNER_TEMP/changed.txt"; then
            echo "Changed since the cached commit:"
            cat "$RUNNER_TEMP/changed.txt"
            while IFS= read -r f; do
              [ -e "$f" ] && touch "$f"
            done < "$RUNNER_TEMP/changed.txt"
            # The engine's objects depend on the unity files only, not on the
            # sources and headers they include, and the glue's .dd files drop
            # absolute, duckdb/ and ../ paths: a change under src/duckdb/, or
            # to the Makevars and make fragments, touches all sources, and
            # ccache absorbs the unchanged ones.
            if grep -Eq '^src/duckdb/|^src/Makevars|^src/include/.*\.mk$' "$RUNNER_TEMP/changed.txt"; then
              echo "Engine or build files changed: touching all engine and glue sources."
              touch_all_sources
            fi
          else
            echo "::warning::Cannot diff against $old_sha; touching every tracked file."
            git ls-files -z | xargs -0 touch
          fi
          if [ -n "$old_sha" ] && [ "$old_flags_hash" != "$flags_hash" ]; then
            echo "Compile flags changed or unrecorded: touching all engine and glue sources."
            touch_all_sources
          fi
          echo "Restored objects: $(find src -name '*.o' | wc -l)"
          echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"

      - name: Prepare ccache and the list of objects the patch affects
        run: |
          ccache --zero-stats
          ccache --show-config | grep -E 'cache_dir|max_size|base_dir|sloppiness|compiler_check'
          # Each patched engine source is compiled through its unity file
          # (src/duckdb/ub_<dir with / as _>.cpp); remove those objects before
          # each build so make cannot reuse an object from the other state.
          : > "$RUNNER_TEMP/affected-objects.txt"
          for p in $(sed -n 's|^+++ b/||p' "$PATCH"); do
            if ! printf '%s\n' "$p" | grep -Eq '^src/duckdb/src/.*\.cpp$'; then
              echo "::error::$PATCH changes $p; only src/duckdb/src/**/*.cpp is supported"
              exit 1
            fi
            rel=${p#src/duckdb/}
            obj="duckdb/ub_$(dirname "$rel" | tr / _).o"
            if ! tr ' ' '\n' < src/include/sources.mk | grep -qxF "$obj"; then
              echo "::error::$p maps to $obj, which src/include/sources.mk does not list"
              exit 1
            fi
            echo "src/$obj" >> "$RUNNER_TEMP/affected-objects.txt"
          done
          sort -u -o "$RUNNER_TEMP/affected-objects.txt" "$RUNNER_TEMP/affected-objects.txt"
          if [ ! -s "$RUNNER_TEMP/affected-objects.txt" ]; then
            echo "::error::$PATCH changes no file"
            exit 1
          fi
          cat "$RUNNER_TEMP/affected-objects.txt"
          touch "$RUNNER_TEMP/build-start.marker"

      - name: "Build 1: unchanged tree (expected to fail), make -k"
        id: unpatched
        continue-on-error: true
        run: |
          SECONDS=0
          trap 'echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          xargs rm -fv < "$RUNNER_TEMP/affected-objects.txt"
          mkdir -p "$RUNNER_TEMP/lib-unpatched"
          export MAKEFLAGS="-k -j$(sysctl -n hw.ncpu)"
          R CMD INSTALL --no-byte-compile --no-test-load -l "$RUNNER_TEMP/lib-unpatched" . \
            > "$RUNNER_TEMP/build-unpatched.log" 2>&1 &
          pid=$!
          # Keep the log visible while it runs, without a pipe that hides the status.
          tail -f "$RUNNER_TEMP/build-unpatched.log" &
          tailpid=$!
          status=0
          wait "$pid" || status=$?
          kill "$tailpid" 2>/dev/null || true
          echo "R CMD INSTALL exit status: $status"
          # Located compiler errors, plus unlocated ones from the driver or linker.
          grep -E '^[^: ]+:[0-9]+:[0-9]+: (fatal )?error:|^(ld|clang[^ :]*): (fatal )?error:|^ld: error|^error:|^ccache: error:' \
            "$RUNNER_TEMP/build-unpatched.log" | sort -u > "$RUNNER_TEMP/errors-unpatched.txt" || true
          grep -E '^make: \*\*\* \[' "$RUNNER_TEMP/build-unpatched.log" | sort -u > "$RUNNER_TEMP/failed-targets-unpatched.txt" || true
          echo "::group::error lines"
          cat "$RUNNER_TEMP/errors-unpatched.txt" "$RUNNER_TEMP/failed-targets-unpatched.txt"
          echo "::endgroup::"
          exit "$status"

      - name: Apply the fix
        run: |
          git apply --verbose "$PATCH"
          git diff --stat
          xargs rm -fv < "$RUNNER_TEMP/affected-objects.txt"

      - name: "Build 2: with the fix (must pass)"
        id: patched
        run: |
          SECONDS=0
          trap 'echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          mkdir -p "$RUNNER_TEMP/lib-patched"
          export MAKEFLAGS="-j$(sysctl -n hw.ncpu)"
          R CMD INSTALL --no-byte-compile -l "$RUNNER_TEMP/lib-patched" . 2>&1 \
            | tee "$RUNNER_TEMP/build-patched.log"

      - name: Smoke test
        id: smoke
        run: |
          SECONDS=0
          trap 'echo "seconds=$SECONDS" >> "$GITHUB_OUTPUT"' EXIT
          export R_LIBS="$RUNNER_TEMP/lib-patched"
          Rscript -e 'library(duckdb); con <- dbConnect(duckdb()); print(dbGetQuery(con, "WITH RECURSIVE t(i) AS (SELECT 1 UNION ALL SELECT i+1 FROM t WHERE i < 3) SELECT * FROM t"))'
          otool -L "$RUNNER_TEMP/lib-patched/duckdb/libs/duckdb.so" | sed -n '1,5p'
          otool -l "$RUNNER_TEMP/lib-patched/duckdb/libs/duckdb.so" | grep -A4 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_MACOSX' | sed -n '1,10p'

      - name: Check the verdict
        id: verdict
        if: always()
        run: |
          # Build 1 must fail on exactly the objects the patch affects, with
          # errors in exactly the patched sources; build 2 and the smoke test
          # must pass.
          ok=true
          touch "$RUNNER_TEMP/errors-unpatched.txt" "$RUNNER_TEMP/failed-targets-unpatched.txt" \
            "$RUNNER_TEMP/affected-objects.txt"
          sed -n 's|^+++ b/src/||p' "$PATCH" | sort -u > "$RUNNER_TEMP/want-error-files.txt"
          sed -E -n 's/^([^:]+):[0-9]+:[0-9]+: (fatal )?error:.*/\1/p' \
            "$RUNNER_TEMP/errors-unpatched.txt" 2>/dev/null | sort -u > "$RUNNER_TEMP/got-error-files.txt"
          # Errors without a file:line:col location count as unexpected files.
          grep -Ev '^[^:]+:[0-9]+:[0-9]+: (fatal )?error:' "$RUNNER_TEMP/errors-unpatched.txt" 2>/dev/null \
            | sed 's/^/<no location> /' >> "$RUNNER_TEMP/got-error-files.txt" || true
          sed -E -n 's/^make: \*\*\* \[([^]]+)\].*/src\/\1/p' \
            "$RUNNER_TEMP/failed-targets-unpatched.txt" 2>/dev/null | sort -u > "$RUNNER_TEMP/got-targets.txt"
          check() {
            if [ "$2" != "$3" ]; then
              echo "::error::$1 differs from the expectation"
              ok=false
            fi
          }
          check "build 1 outcome" "${{ steps.unpatched.outcome }}" failure
          check "build 2 outcome" "${{ steps.patched.outcome }}" success
          check "smoke test outcome" "${{ steps.smoke.outcome }}" success
          echo "--- failed targets of build 1: expected vs actual"
          diff "$RUNNER_TEMP/affected-objects.txt" "$RUNNER_TEMP/got-targets.txt" \
            && echo "(identical)" || { echo "::error::failed targets of build 1 are not the affected objects"; ok=false; }
          echo "--- files with error: lines in build 1: expected vs actual"
          diff "$RUNNER_TEMP/want-error-files.txt" "$RUNNER_TEMP/got-error-files.txt" \
            && echo "(identical)" || { echo "::error::errors of build 1 are not exactly in the patched files"; ok=false; }
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          # Anything compiled in this run besides the affected objects?
          new=$(find src -name '*.o' -newer "$RUNNER_TEMP/build-start.marker" 2>/dev/null \
            | { grep -vxF -f "$RUNNER_TEMP/affected-objects.txt" || true; } | wc -l | tr -d ' ')
          echo "objects compiled besides the affected ones: $new"
          echo "recompiled=$new" >> "$GITHUB_OUTPUT"
          echo "verdict ok: $ok"

      - name: Record the build state for the next run
        id: record
        # Build 1 compiled the unchanged tree, so its objects are current for
        # this commit whatever the verdict.
        if: >-
          always() && !cancelled() &&
          (steps.unpatched.outcome == 'success' || steps.unpatched.outcome == 'failure')
        run: |
          # The cache holds objects of the unchanged tree only: drop the
          # patched ones, so a later patch that loses a hunk cannot reuse them.
          xargs rm -fv < "$RUNNER_TEMP/affected-objects.txt"
          mkdir -p "$BUILD_CACHE_META"
          echo "$GITHUB_SHA" > "$BUILD_CACHE_META/sha"
          echo "${{ steps.mtimes.outputs.flags_hash }}" > "$BUILD_CACHE_META/flags"
          echo "${{ steps.mtimes.outputs.toolchain }}" > "$BUILD_CACHE_META/toolchain"

      - name: Replace this job's cache entry
        id: replace
        # Only after build 1 ran, and only when the entry would change.
        if: >-
          always() && !cancelled() && steps.unpatched.outcome != 'skipped' &&
          (steps.restore.outputs.cache-hit != 'true' || steps.sdk.outputs.downloaded == 'true' ||
           steps.verdict.outputs.recompiled != '0')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "start_ts=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          if [ "${{ steps.record.outcome }}" != "success" ]; then
            echo "No build record: saving the SDK and ccache only."
            find src -name '*.o' -delete
            rm -rf "$BUILD_CACHE_META"
          fi
          ccache --cleanup
          ccache --show-stats | grep -i 'cache size'
          # Size guard: the entry as the action would store it, a zstd tar of
          # the same paths. Above the limit, the objects stay out of it.
          limit=950000000
          measure() {
            { find ~/sdk "$CCACHE_DIR" "$BUILD_CACHE_META" -type f 2>/dev/null || true
              find src -name '*.o' -type f; } \
              | tar -cf - -T - 2>/dev/null | zstd -T0 -3 -q -c | wc -c | tr -d ' '
          }
          size=$(measure)
          echo "estimated entry size: $size bytes (limit $limit)"
          if [ "$size" -gt "$limit" ]; then
            echo "::warning::Cache entry would be $size bytes, over $limit: saving the SDK and ccache only."
            echo "oversize=$size" >> "$GITHUB_OUTPUT"
            find src -name '*.o' -delete
            rm -rf "$BUILD_CACHE_META"
            size=$(measure)
            echo "estimated entry size without objects: $size bytes"
          fi
          echo "size=$size" >> "$GITHUB_OUTPUT"
          # First this branch's entries under keys this workflow no longer
          # uses, then this job's own entry, which the next step saves anew.
          { gh cache list -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 --json key,id \
              --jq '.[] | select(.key | test("^(issue-2974-build-|issue-2974-ccache-|macos-sdk-phracker-)")) | "\(.id) \(.key)"' \
            | while read -r id key; do
                echo "Deleting superseded entry $key"
                gh cache delete "$id" -R "$GITHUB_REPOSITORY" || true
              done; } || true
          gh cache delete "$CACHE_KEY" -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" || true

      - name: Save the SDK, ccache and the build tree
        id: save
        if: always() && steps.replace.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/sdk
            ${{ env.CCACHE_DIR }}
            ${{ env.BUILD_CACHE_META }}
            src/*.o
            src/duckdb/**/*.o
          key: ${{ env.CACHE_KEY }}

      - name: Job summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          s="$GITHUB_STEP_SUMMARY"
          {
            echo "## issue #2974: MacOSX${SDK_VERSION} SDK reproducer"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Runner | ${{ matrix.runner }} (${{ matrix.arch }}), $(sw_vers -productVersion) |"
            echo "| R | $(R --version | sed -n '1,1p') |"
            echo "| Xcode | ${{ steps.xcode.outputs.version }} |"
            echo "| clang | ${{ steps.xcode.outputs.clang }} |"
            echo "| CRAN clang | Apple clang version 14.0.3 (clang-1403.0.22.14.1), MacOSX11.3.1.sdk (${{ matrix.cran }}) |"
            echo "| Fidelity | clang ${{ steps.xcode.outputs.clang }} against the 11.3 SDK's libc++, while CRAN uses clang 14.0.3: this tests the library headers, not the compiler |"
            echo "| libc++ headers | \`${{ steps.toolchain.outputs.first_libcxx }}\`, _LIBCPP_VERSION ${{ steps.toolchain.outputs.libcxx }} |"
            echo "| Cache entry | \`$CACHE_KEY\`, hit: ${{ steps.restore.outputs.cache-hit || 'false' }}, objects built from ${{ steps.mtimes.outputs.cache_sha }} |"
            echo
            echo "### Steps"
            echo
            echo "| Step | Outcome | Seconds |"
            echo "|---|---|---|"
            echo "| Normalize mtimes | ${{ steps.mtimes.outcome }} | ${{ steps.mtimes.outputs.seconds }} |"
            echo "| Build 1: unchanged tree (expected failure) | ${{ steps.unpatched.outcome }} | ${{ steps.unpatched.outputs.seconds }} |"
            echo "| Build 2: with fix | ${{ steps.patched.outcome }} | ${{ steps.patched.outputs.seconds }} |"
            echo "| Smoke test | ${{ steps.smoke.outcome }} | ${{ steps.smoke.outputs.seconds }} |"
            echo
            echo "Verdict holds: ${{ steps.verdict.outputs.ok || 'false' }}." \
              "Objects compiled besides the affected ones: ${{ steps.verdict.outputs.recompiled }}." \
              "Build record written: ${{ steps.record.outcome == 'success' && 'yes' || 'no' }}."
            if [ -n "${{ steps.replace.outputs.oversize }}" ]; then
              echo
              echo "**Warning:** the entry would have been ${{ steps.replace.outputs.oversize }} bytes; objects were left out."
            fi
            # Saved means an entry under this key created after the replace step began.
            saved=$(gh cache list -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --key "$CACHE_KEY" --limit 10 \
              --json key,createdAt,sizeInBytes \
              --jq '.[] | select(.key == env.CACHE_KEY and .createdAt >= "${{ steps.replace.outputs.start_ts || '9999' }}") | "\(.sizeInBytes)"' 2>/dev/null || true)
            echo
            if [ -n "$saved" ]; then
              echo "Cache entry \`$CACHE_KEY\` saved: $saved bytes (estimated ${{ steps.replace.outputs.size }})."
            else
              echo "Cache entry \`$CACHE_KEY\` not saved in this run (save step: ${{ steps.save.outcome }})."
            fi
            echo
            echo "### Errors of build 1"
            echo
            echo '```'
            cat "$RUNNER_TEMP/errors-unpatched.txt" 2>/dev/null || echo "(no log)"
            echo
            cat "$RUNNER_TEMP/failed-targets-unpatched.txt" 2>/dev/null || true
            echo '```'
            echo
            echo "### ccache"
            echo
            echo '```'
            ccache --show-stats -v 2>&1 || ccache --show-stats 2>&1 || true
            echo '```'
            echo
            echo "### Cache size"
            echo
            echo '```'
            du -sh "$CCACHE_DIR" 2>/dev/null || true
            echo "objects: $(find src -name '*.o' | wc -l | tr -d ' ') files, $(find src -name '*.o' -print0 | xargs -0 du -ck 2>/dev/null | tail -n 1 | cut -f1) KiB"
            ls -l src/*.so 2>/dev/null || true
            echo
            echo "This branch's cache entries:"
            gh cache list -R "$GITHUB_REPOSITORY" --ref "$GITHUB_REF" --limit 100 \
              --json key,sizeInBytes --jq '.[] | "\(.key)\t\(.sizeInBytes)"' 2>&1 || true
            echo '```'
          } >> "$s"
          cat "$s"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-2974-build-logs-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/build-*.log
            ${{ runner.temp }}/errors-unpatched.txt
            ${{ runner.temp }}/clang-v.txt
          retention-days: 7

      - name: Require the verdict
        if: always()
        run: |
          if [ "${{ steps.verdict.outputs.ok }}" != "true" ]; then
            echo "::error::Verdict failed: see the step \"Check the verdict\" for the comparison."
            exit 1
          fi
