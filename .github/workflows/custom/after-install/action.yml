name: 'Custom steps to run after R packages are installed'

runs:
  using: "composite"
  steps:
    # Must be done after installing R because rtools is installed only then
    - name: Compute cache key
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1'
      run: |
        echo "DUCKDB_R_PREBUILT_ARCHIVE_GHA_CACHE_KEY=duckdb-tar-R$(Rscript --vanilla -e 'cat(format(getRversion()))')-${{ runner.os }}-$($(R CMD config CXX) --version | head -n 1 | sed -r 's/[, ]/-/g')-${{ hashFiles('src/duckdb/**') }}" | tee -a $GITHUB_ENV
        echo "DUCKDB_R_PREBUILT_ARCHIVE=${{ runner.temp }}/duckdb.tar" | tee -a $GITHUB_ENV
      shell: bash

    - name: Cache duckdb archive
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1'
      uses: actions/cache@v4
      with:
        path: ${{ env.DUCKDB_R_PREBUILT_ARCHIVE }}
        key: ${{ env.DUCKDB_R_PREBUILT_ARCHIVE_GHA_CACHE_KEY }}

    - name: Detect an unreleased R
      run: |
        ## -- Detect an unreleased R --
        # The persistent ccache below is keyed on getRversion(), and that key is
        # only honest for a released R, where the version number changes
        # whenever the installation does. R-devel is rebuilt every day but keeps
        # reporting the same number for months, so one cache entry ends up
        # serving an arbitrary span of R-devel snapshots -- and restoring it in
        # the rcc R-devel job has produced build failures. Skip the persistent
        # cache there and build cold; ccache itself stays configured by the
        # install action, so reuse within the job is unaffected.
        #
        # R.version$status is empty for a released R and non-empty for one that
        # moves under a fixed version number ("Under development (unstable)" for
        # R-devel, "Patched" for R-patched) -- exactly the builds the key cannot
        # tell apart.
        echo "DUCKDB_R_UNRELEASED=$(Rscript --vanilla -e 'cat(if (nzchar(R.version$status)) "1" else "0")')" | tee -a $GITHUB_ENV
      shell: bash

    - name: Compute ccache key
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1' && env.DUCKDB_R_UNRELEASED != '1'
      run: |
        echo "GHA_CCACHE_KEY=${{ runner.os }}-$($(R CMD config CXX) --version | head -n 1 | sed -r 's/[, ]/-/g')-R-$(Rscript --vanilla -e 'cat(format(getRversion()))')" | tee -a $GITHUB_ENV
      shell: bash

    - name: Install persistent ccache
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1' && env.DUCKDB_R_UNRELEASED != '1'
      uses: hendrikmuhs/ccache-action@v1.2.14
      with:
        key: ${{ env.GHA_CCACHE_KEY }}
        max-size: 200M
        verbose: 1

    # The vendored half of the compiler-warning gate
    # (handbook/build/warnings/README.md). It rides the build that is already
    # happening rather than compiling the engine a second time: the flags go on
    # the install below, and the scan step after it judges that install's log.
    # Only where the vendored sources are actually compiled -- under
    # DUCKDB_R_USE_SYSTEM_LIB the engine is linked, not built, and there would be
    # nothing to read.
    #
    # Here rather than in before-install, because ~/.R/Makevars is read by every
    # build that follows, not only by the one being scanned: from before-install
    # the flags also reached `R CMD check`'s build, and reached each.yaml's
    # per-commit builds, which run before-install without this action at all.
    # Written next to the install it belongs to, the flags cover it and nothing
    # else in the job that matters to the gate.
    #
    # CPPFLAGS rather than CXX17FLAGS, because R appends CPPFLAGS to the
    # package's own and replaces CXX17FLAGS -- which would drop the platform's
    # optimisation settings. The vendored tree has no C sources, so a C++-only
    # flag never reaches a C compile.
    - name: Put the vendored warning flags on this build
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1'
      run: |
        mkdir -p ~/.R
        echo "CPPFLAGS += $(scripts/warnings.sh flags vendored)" | tee -a ~/.R/Makevars
      shell: bash

    - name: Install to avoid R CMD INSTALL --pre-clean run otherwise
      run: |
        set -o pipefail
        mkdir ../lib
        R CMD INSTALL --library=$(dirname $(pwd))/lib -d --no-byte-compile . 2>&1 |
          tee "${RUNNER_TEMP}/install.log"
      shell: bash

    # The vendored half of the compiler-warning gate
    # (handbook/build/warnings/README.md): judge the log of the build that just
    # ran, which before-install put the vendored warning flags on. Nothing is
    # compiled twice.
    #
    # It reads what this entry actually compiled. Objects restored from
    # DUCKDB_R_PREBUILT_ARCHIVE are not recompiled and so raise nothing -- but
    # that cache is keyed on hashFiles('src/duckdb/**'), so a vendored tree that
    # changed is always built afresh, which is the tree this gate is for.
    # ccache, by contrast, replays a cached compile's diagnostics, so it hides
    # nothing.
    - name: Check that the vendored sources compiled without warnings
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1'
      run: scripts/warnings.sh scan vendored "${RUNNER_TEMP}/install.log"
      shell: bash

    - name: Show ccache stats
      if: env.DUCKDB_R_USE_SYSTEM_LIB != '1'
      run: |
        ccache -s
      shell: bash

    # Guard for the flavor rename: fail when the package name is hard-coded
    # somewhere scripts/flavor.patch does not rewrite it. The equivalent testthat
    # test (tests/testthat/test-flavor-package-name.R) can only skip under R CMD
    # check, which runs from a built tarball where neither the sources nor
    # scripts/ (.Rbuildignore'd) exist -- so the scan runs here, against the
    # checkout. Base R only, no package needed.
    #
    # This action runs in every matrix entry, but the scan reads the checkout
    # and nothing else, so its result is the same everywhere. Run it in the
    # smoke test only -- the gate that also styles, roxygenizes and updates
    # snapshots -- rather than a dozen more times for the same answer.
    # The glue half of the compiler-warning gate
    # (handbook/build/warnings/README.md). It compiles the ~15 translation units
    # in src/ with the glue warning set and fails on anything the glue owns;
    # warnings raised inside the vendored engine headers are counted, not
    # enforced, because a glue file is not answerable for what an engine header
    # says. Roughly a minute, and it needs only the checkout -- the vendored
    # headers are committed -- so it is independent of which build mode this
    # entry ran in.
    #
    # Like the flavor scan below, the answer is the same in every matrix entry,
    # so it runs in the smoke test only. The vendored half is not here: it rides
    # the source build in the vendored-build entry instead, via the flags step
    # in before-install and the scan step above.
    - name: Check that the glue compiles without warnings
      if: github.job == 'rcc-smoke'
      run: scripts/warnings.sh glue
      shell: bash

    - name: Check that the package name is hard-coded only where scripts/flavor.patch rewrites it
      if: github.job == 'rcc-smoke'
      run: |
        source("scripts/flavor-package-name.R")
        offenders <- flavor_package_name_offenders(".")
        if (length(offenders) > 0) {
          writeLines(offenders)
          stop(
            "The package name is hard-coded outside scripts/flavor.patch; ",
            "see scripts/flavor-package-name.R for how to resolve this."
          )
        }
        writeLines("No hard-coded package name outside scripts/flavor.patch.")
        unflavored <- flavor_unflavored_paths(".")
        if (length(unflavored) > 0) {
          writeLines(unflavored)
          stop(
            "A file scripts/flavor.patch renames still carries the mainline ",
            "name; see scripts/flavor-package-name.R for how to resolve this."
          )
        }
        writeLines("No file left under the mainline name.")
        readmes <- flavor_mainline_readme_offenders(".")
        if (length(readmes) > 0) {
          writeLines(readmes)
          stop(
            "A generated README still tells a reader to install the mainline ",
            "package; see scripts/flavor-package-name.R for how to resolve this."
          )
        }
        writeLines("No generated README pointing at the mainline package.")
      shell: Rscript {0}
